<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>DSI Island — The Discovery</title>
<meta name="description" content="DSI Island · Part 1: The Discovery — an interactive pixel-art cinematic.">
<link rel="preload" href="assets/sprites/environment_atlas.png" as="image">
<link rel="preload" href="assets/sprites/explorer_sheet.png" as="image">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stage" aria-label="DSI Island cinematic"></canvas>

<section id="title" aria-label="Title screen">
  <canvas id="title-logo" class="px" aria-hidden="true"></canvas>
  <h1 class="sr">DSI Island — Part 1: The Discovery</h1>
  <button id="start" class="pxbtn" aria-label="Start adventure"></button>
  <div id="loadbar" aria-hidden="true"><i></i></div>
  <p class="hint" id="hint" aria-label="Best with sound on"></p>
  <p id="err"></p>
</section>

<div id="hud" hidden>
  <button id="replay" class="icon" aria-label="Replay from the beginning" title="Replay">
    <svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="currentColor" d="M3 1h4v1h1v5H7v1H2V7H1V5h2v1h1v1h3V2H4v1h1v1H1V1h1v1h1z"/></svg>
  </button>
  <button id="sound" class="icon" aria-label="Mute sound" aria-pressed="false" title="Sound">
    <svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="currentColor" d="M1 3h2V2h1V1h1v7H4V7H3V6H1z"/><path class="on" fill="currentColor" d="M6 3h1v3H6zM7 2h1v1H7zM7 6h1v1H7zM8 3h1v3H8z"/><path class="off" fill="currentColor" d="M6 3h1v1H6zm2 0h1v1H8zM7 4h1v1H7zM6 5h1v1H6zm2 0h1v1H8z"/></svg>
  </button>
</div>
<button id="replay-big" class="pxbtn" hidden aria-label="Replay the adventure"></button>

<script type="module" src="js/main.js"></script>
</body>
</html>
